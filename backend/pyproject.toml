[project]
name = "vedic-engine"
version = "0.1.0"
description = "Vedic astrology calculation engine (Swiss Ephemeris) with a thin FastAPI wrapper"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pyswisseph>=2.10.3,<2.11",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic>=2.8",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "hypothesis",
    "ruff",
    "mypy",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedic_engine", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Network tests are skipped by default; run them with: pytest -m network
# Perf tests time wall-clock latency, so they are skipped by default (they fail under
# `-n auto`, where workers compete for cores); run them serially with: pytest -m perf -s
addopts = "-m 'not network and not perf'"
# Starlette 1.x deprecates httpx in TestClient in favour of httpx2, whose provenance we have
# not verified; the official httpx stays.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
markers = [
    "golden: golden-file regression tests against reference data",
    "perf: performance / latency budget tests",
    "network: tests that need network access (skipped by default)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["swisseph"]
ignore_missing_imports = true
